<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notinha</title>
<meta name="description" content="Leia o QR Code da nota do mercado e acompanhe quanto você gasta e quanto cada produto subiu.">
<meta name="theme-color" content="#E4E8E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D1B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/jsQR.js" defer></script>
<script src="js/app.js" type="module"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#notas"><img src="icon.svg" alt="" width="28" height="28"> Notinha</a>
  <button class="icon-btn" id="abrir-ajustes" type="button" aria-label="Backup das notas">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Seções">
  <a href="#notas" data-tab="notas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6M9 12h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    Notas</a>
  <a href="#ler" data-tab="ler" class="tab-ler">
    <span class="ler-disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9h2v2H9zM13 13h2v2h-2zM13 9h2v2h-2zM9 13h2v2H9z" fill="currentColor"/></svg></span>
    Ler nota</a>
  <a href="#precos" data-tab="precos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="8.5" r="1.6" fill="currentColor"/></svg>
    Preços</a>
</nav>

<dialog id="ajustes" aria-labelledby="ajustes-titulo">
  <form method="dialog" class="sheet">
    <h2 id="ajustes-titulo">Backup</h2>
    <p>Suas notas ficam só neste aparelho. Se você limpar os dados do navegador, elas somem. Guarde um backup de vez em quando.</p>
    <button type="button" class="btn" id="exportar">Baixar backup</button>
    <button type="button" class="btn btn-ghost" id="importar">Restaurar backup</button>
    <input type="file" id="importar-arquivo" accept="application/json,.json" hidden>
    <p class="status" id="ajustes-status" role="status"></p>
    <button class="btn btn-ghost" value="fechar">Fechar</button>
  </form>
</dialog>
</body>
</html>
